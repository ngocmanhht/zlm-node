services:
  # ZLMediaKit Standalone Worker Node
  # Tự động kết nối & đăng ký vào WVP Master thông qua Cluster Join Token
  zlm-worker:
    image: ${ZLM_IMAGE:-zlmediakit/zlmediakit:master}
    container_name: ${NODE_ID:-zlm_node_01}
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    ports:
      - "${ZLM_HTTP_PORT:-80}:80/tcp"
      - "${ZLM_RTMP_PORT:-1935}:1935/tcp"
      - "${ZLM_RTMP_PORT:-1935}:1935/udp"
      - "${ZLM_RTSP_PORT:-554}:554/tcp"
      - "${ZLM_RTSP_PORT:-554}:554/udp"
      - "${ZLM_RTP_PORT:-10000}:10000/tcp"
      - "${ZLM_RTP_PORT:-10000}:10000/udp"
      - "8000:8000/udp"                                   # WebRTC UDP
      - "8000:8000/tcp"                                   # WebRTC TCP
      - "30000-30500:30000-30500/udp"                     # GB28181 RTP Port Range UDP
      - "30000-30500:30000-30500/tcp"                     # GB28181 RTP Port Range TCP
    # Lưu ý: Trên Linux Production hiệu năng cao, comment mục `ports:` ở trên
    # và bỏ comment dòng `network_mode: host` dưới đây để có hiệu năng tốt nhất (tránh nghẽn docker-proxy):
    # network_mode: "host"
    volumes:
      - ./config.ini:/conf/config.ini
      - ./volumes/record:/opt/media/bin/www/record/
      - ./volumes/log:/opt/media/log/
    command: ["MediaServer", "-c", "/conf/config.ini", "-l", "0"]
