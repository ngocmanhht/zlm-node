; ==============================================================================
; ZLMediaKit Configuration Template (Cluster Join Token Architecture)
; ==============================================================================

[api]
apiDebug=1
defaultSnap=./www/logo.png
downloadRoot=./www;
secret=secret_node_01_random_secure_key
snapRoot=./www/snap/

[cluster]
origin_url=
retry_count=3
timeout_sec=15

[ffmpeg]
bin=/usr/bin/ffmpeg
cmd=%s -re -i %s -c:a aac -strict -2 -ar 44100 -ab 48k -c:v libx264 -f flv %s
log=./ffmpeg/ffmpeg.log
restart_sec=0
snap=%s -rtsp_transport tcp -i %s -y -f mjpeg -frames:v 1 %s

[general]
broadcast_player_count_changed=0
check_nvidia_dev=1
enableVhost=0
enable_ffmpeg_log=0
flowThreshold=1024
listen_ip=::
maxStreamWaitMS=15000
mediaServerId=zlm_node_01
mergeWriteMS=0
resetWhenRePlay=1
streamNoneReaderDelayMS=20000
unready_frame_cache=100
wait_add_track_ms=3000
wait_audio_track_data_ms=1000
wait_track_ready_ms=10000

[hls]
broadcastRecordTs=0
deleteDelaySec=10
fastRegister=0
fileBufSize=65536
segDelay=0
segDur=2
segKeep=0
segNum=3
segRetain=5

[hook]
alive_interval=10.0
enable=1
; Gửi kèm Cluster Join Token và cấu hình mạng ngoại vi để WVP Master tự động nhận diện
admin_params=secret=wvp_cluster_join_secret_key_2026&node_ip=192.168.1.101&sdp_ip=27.71.24.106&stream_ip=27.71.24.106
on_flow_report=
on_http_access=
on_play=http://192.168.1.100:18978/index/hook/on_play
on_publish=http://192.168.1.100:18978/index/hook/on_publish
on_record_mp4=http://192.168.1.100:18978/index/hook/on_record_mp4
on_record_ts=
on_rtp_server_timeout=http://192.168.1.100:18978/index/hook/on_rtp_server_timeout
on_rtsp_auth=
on_rtsp_realm=
on_send_rtp_stopped=http://192.168.1.100:18978/index/hook/on_send_rtp_stopped
on_server_exited=
on_server_keepalive=http://192.168.1.100:18978/index/hook/on_server_keepalive
on_server_started=http://192.168.1.100:18978/index/hook/on_server_started
on_shell_login=
on_stream_changed=http://192.168.1.100:18978/index/hook/on_stream_changed
on_stream_none_reader=http://192.168.1.100:18978/index/hook/on_stream_none_reader
on_stream_not_found=http://192.168.1.100:18978/index/hook/on_stream_not_found
retry=1
retry_delay=3.0
stream_changed_schemas=rtsp/rtmp/fmp4/ts/hls/hls.fmp4
timeoutSec=30

[http]
allow_cross_domains=1
allow_ip_range=
charSet=utf-8
dirMenu=1
forbidCacheSuffix=
forwarded_ip_header=
keepAliveSecond=30
maxReqSize=40960
port=80
rootPath=./www
sendBufSize=65536
sslport=443
virtualPath=

[multicast]
addrMax=239.255.255.255
addrMin=239.0.0.0
udpTTL=64

[protocol]
add_mute_audio=1
auto_close=0
continue_push_ms=3000
enable_audio=1
enable_fmp4=1
enable_hls=0
enable_hls_fmp4=0
enable_mp4=0
enable_rtmp=1
enable_rtsp=1
enable_ts=1
fmp4_demand=0
hls_demand=0
hls_save_path=./www
mp4_as_player=0
mp4_max_second=3600
mp4_save_path=./www
paced_sender_ms=0
rtmp_demand=0
rtsp_demand=0
snap_once=1
ts_demand=0

[record]
appName=record
enableFmp4=1
fastStart=0
fileBufSize=65536
fileRepeat=0
sampleMS=500

[rtp]
audioMtuSize=600
clearCacheThreshold=10
h264_stap_a=1
lowLatency=0
rtpMaxSize=10
videoMtuSize=1400

[rtp_proxy]
checkSource=1
dumpDir=
gop_cache=1
h264_pt=98
h265_pt=99
opus_pt=100
port=10000
port_range=30000,30500
ps_pt=96
timeoutSec=15

[rtc]
externIP=
port=8000
preferredCodecA=PCMU,PCMA,opus
preferredCodecV=H264,H265
rembBitRate=0
tcpPort=8000
timeoutSec=15

[rtmp]
handshakeSecond=15
keepAliveSecond=15
port=1935
sslport=0

[rtsp]
authBasic=0
directProxy=1
handshakeSecond=15
keepAliveSecond=15
lowLatency=0
port=554
sslport=0
